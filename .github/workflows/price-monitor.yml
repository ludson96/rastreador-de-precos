name: Price Monitor Scheduled Run

on:
  schedule:
    # Executa a cada 30 minutos (para alertas de desconto imediatos)
    - cron: '*/30 * * * *'
    # Executa uma vez ao dia às 08:00 BRT (11:00 UTC) para o Relatório Diário
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite execução manual pelo GitHub
    inputs:
      daily_report:
        description: 'Enviar Relatório Diário por e-mail'
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore SQLite Database Cache
        uses: actions/cache@v4
        with:
          path: data/price_history.db
          key: sqlite-db-${{ github.run_id }}
          restore-keys: |
            sqlite-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest

      - name: Execute Regular Price Monitor
        if: github.event.schedule != '0 11 * * *' && inputs.daily_report != true
        env:
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m src.main

      - name: Execute Daily Report Monitor
        if: github.event.schedule == '0 11 * * *' || inputs.daily_report == true
        env:
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m src.main --daily-report


